<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Events | RSU</title><link rel="manifest" href="/manifest.webmanifest"><meta name="theme-color" content="#142b4a"><link rel="stylesheet" href="/css/style.css"><script defer src="/js/app.js"></script></head><body data-page="manageevents"><header class="top"><a class="brand" href="/"><b>RSU</b> Campus Events</a><nav><a href="/events.html">Events</a><a href="/announcements.html">Announcements</a><a href="/dashboard.html">Student</a><a href="/organizer.html">Organizer</a><a href="/login.html">Sign in</a><button id="logout" class="btn alt">Sign out</button></nav></header><main class="wrap"><h1>Manage events</h1><form id="eventForm" class="form"><h2>Add / Edit event</h2><input type="hidden" name="id"><label>Title<input name="title" required></label><label>Description<textarea name="description"></textarea></label><div class="formrow"><label>Date<input type="date" name="date" required></label><label>Time<input type="time" name="time"></label><label>Venue<input name="venue" required></label><label>Capacity (0 unlimited)<input type="number" name="capacity" value="0"></label></div><label>Status<select name="status"><option>upcoming</option><option>ongoing</option><option>completed</option><option>cancelled</option></select></label><button class="btn">Save event</button> <button type="reset" id="clear" class="btn alt">Clear</button></form><h2>Event records</h2><div id="records" class="cards"></div></main><footer>Romblon State University – Cajidiocan Campus · School Event Registration</footer><div id="toast" class="toast"></div></body></html>
